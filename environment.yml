name: ResAgent2
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pydantic>=2.12,<3
  - pytest>=9,<10
  - pip:
      - -e ./packages/contracts
      - -e ./packages/runtime
      - -e ./packages/capabilities
      - -e ./packages/orchestrator
      - -e ./packages/agents/coding
      - -e ./packages/agents/experiment
variables:
  PYTHONNOUSERSITE: "1"
